plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

// Optional Mod Menu integration. Set modmenu_version in gradle.properties to enable it.
def modmenuVersion = project.findProperty('modmenu_version')
def modmenuOn = modmenuVersion != null
// Optional Cloth Config screen. Set cloth_version in gradle.properties to enable it.
def clothVersion = project.findProperty('cloth_version')

repositories {
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/'
	}
	maven {
		name = 'Shedaniel'
		url = 'https://maven.shedaniel.me/'
	}
}

sourceSets {
	main {
		java {
			if (!modmenuVersion) {
				exclude 'com/farmfps/compat/ModMenuIntegration.java'
			}
			// Leftover from Update 18 (unpack never deletes files); no longer used.
			exclude 'com/farmfps/compat/YaclScreen.java'
			if (!clothVersion) {
				exclude 'com/farmfps/compat/ClothScreen.java'
			}
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	if (modmenuVersion) {
		modCompileOnly "com.terraformersmc:modmenu:${modmenuVersion}"
	}
	if (clothVersion) {
		modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${clothVersion}") {
			exclude group: 'net.fabricmc.fabric-api'
		}
	}
}

processResources {
	def modVersion = project.version
	inputs.property "version", modVersion
	inputs.property "modmenuOn", modmenuOn

	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}

	// The source fabric.mod.json must stay valid JSON, so the Mod Menu entrypoint
	// is added to the processed copy only when Mod Menu support is enabled.
	doLast {
		if (modmenuOn) {
			def f = new File(destinationDir, 'fabric.mod.json')
			def json = new groovy.json.JsonSlurper().parse(f)
			json.entrypoints.modmenu = ['com.farmfps.compat.ModMenuIntegration']
			f.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
