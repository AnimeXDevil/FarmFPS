// Yarn-mapped build for Minecraft 1.20 - 1.21.x. The CI (release-all.yml) passes the exact versions
// with -Pminecraft_version / -Pyarn_mappings / -Pfabric_api_version / -Pmodmenu_version / -Pjava_release.
plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

def modmenuVersion = project.findProperty('modmenu_version')
def modmenuOn = modmenuVersion != null && modmenuVersion.toString().trim() != ''
// SoundManager.play returned void up to 1.21.5; from 1.21.6 it returns a PlayResult.
def mcParts = project.minecraft_version.toString().tokenize('.')*.toInteger()
def legacySound = mcParts[0] == 1 && (mcParts[1] < 21 || (mcParts[1] == 21 && (mcParts.size() > 2 ? mcParts[2] : 0) < 6))
def javaRelease = (project.findProperty('java_release') ?: '21').toString().toInteger()

repositories {
	mavenCentral()
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/'
	}
}

sourceSets {
	main {
		java {
			// Leftovers from earlier updates (unpack never deletes files) and optional parts.
			exclude 'com/farmfps/compat/ClothScreen.java'
			exclude 'com/farmfps/compat/YaclScreen.java'
			exclude(legacySound ? 'com/farmfps/mixin/SoundThrottleMixin.java' : 'com/farmfps/mixin/SoundThrottleLegacyMixin.java')
			if (!modmenuOn) {
				exclude 'com/farmfps/compat/ModMenuIntegration.java'
			}
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	if (modmenuOn) {
		modCompileOnly("com.terraformersmc:modmenu:${modmenuVersion}") { transitive = false }
	}
}

processResources {
	def props = [
		version     : project.version,
		mc_dep      : project.findProperty('mc_dep') ?: project.minecraft_version,
		java_min    : javaRelease.toString(),
		mixin_java  : "JAVA_${javaRelease}".toString(),
		sound_mixin : legacySound ? 'SoundThrottleLegacyMixin' : 'SoundThrottleMixin',
	]
	inputs.properties props
	inputs.property "modmenuOn", modmenuOn

	filesMatching(["fabric.mod.json", "farmfps.mixins.json"]) {
		expand props
	}

	// The Mod Menu entrypoint is added to the processed copy only when Mod Menu support is built in.
	doLast {
		if (modmenuOn) {
			def f = new File(destinationDir, 'fabric.mod.json')
			def json = new groovy.json.JsonSlurper().parse(f)
			json.entrypoints.modmenu = ['com.farmfps.compat.ModMenuIntegration']
			f.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = javaRelease
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.toVersion(javaRelease)
	targetCompatibility = JavaVersion.toVersion(javaRelease)
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName
	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
