# Publishes the Minecraft 26.2 build (folder mc26/) as its own GitHub release marked Latest.
# Tag: v<version>-mc26.2   Asset: farmfps-<version>-mc26.2.jar
name: release-26.2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mc26/**', '.github/workflows/release-26.2.yml']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'
      - name: build
        working-directory: mc26
        run: gradle build --no-daemon
      - name: publish
        working-directory: mc26
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)
          TAG="v${VERSION}-mc26.2"
          NAME="farmfps-${VERSION}-mc26.2.jar"
          cp "$(ls build/libs/*.jar | grep -v -- '-sources' | head -n 1)" "$NAME"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --latest \
              --title "FarmFPS ${VERSION} for Minecraft 26.2" \
              --notes "Client-side Fabric mod. Needs Fabric Loader 0.19.3+, Fabric API and Java 25. Optional: Cloth Config + Mod Menu for the settings screen."
          fi
          gh release upload "$TAG" "$NAME" --clobber
