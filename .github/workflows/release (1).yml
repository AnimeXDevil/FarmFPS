# Publishes the 1.21.11 build as its own GitHub release.
# (GitHub only allows one release to carry the "Latest" badge; that one is the 26.2 release.)
# Tag: v<version>-mc1.21.11   Asset: farmfps-<version>-mc1.21.11.jar
# Re-running replaces the jar on the same release; no extra tags are created per build.
name: release-1.21.11
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['mc26/**', '.github/workflows/*26.2*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'
      - name: build
        run: gradle build --no-daemon
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION=$(grep '^version=' gradle.properties | cut -d= -f2)
          TAG="v${VERSION}-mc1.21.11"
          NAME="farmfps-${VERSION}-mc1.21.11.jar"
          cp "$(ls build/libs/*.jar | grep -v -- '-sources' | head -n 1)" "$NAME"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --latest=false \
              --title "FarmFPS ${VERSION} for Minecraft 1.21.11" \
              --notes "Client-side Fabric mod. Needs Fabric Loader 0.20.1+ and Fabric API. Optional: Cloth Config + Mod Menu for the settings screen."
          fi
          gh release upload "$TAG" "$NAME" --clobber
