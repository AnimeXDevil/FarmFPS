# Builds the Minecraft 26.2 port in mc26/. Does not publish a release yet:
# the port is being done in phases and each phase must compile first.
name: build-26.2
on:
  push:
    paths: ['mc26/**', '.github/workflows/build-26.2.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'
      - name: build
        working-directory: mc26
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v7
        with:
          name: farmfps-26.2
          path: mc26/build/libs/
