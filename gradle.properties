# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.20.1
loom_version=1.19-SNAPSHOT

# Mod Properties
version=1.0.0
group=com.farmfps

# Dependencies
fabric_api_version=0.141.6+1.21.11

# Optional: Mod Menu integration (config button in the mod list).
# Look up the Mod Menu version built for 1.21.11 on https://modrinth.com/mod/modmenu/versions
# then remove the leading # and set it here, e.g. modmenu_version=17.0.0
modmenu_version=17.0.1

# Optional: YetAnotherConfigLib settings screen (tabs, hover descriptions, item lists).
# Remove the line to build without it; the built-in screen is used instead.
yacl_version=3.8.1+1.21.11-fabric
